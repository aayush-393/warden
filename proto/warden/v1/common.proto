syntax = "proto3";

package warden.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

enum Direction {
  DIRECTION_UNSPECIFIED = 0;
  DIRECTION_REQUEST = 1;
  DIRECTION_RESPONSE = 2;
}

enum Protocol {
  PROTOCOL_UNSPECIFIED = 0;
  PROTOCOL_MCP = 1;
  PROTOCOL_A2A = 2;
}

enum ResourceKind {
  RESOURCE_KIND_UNSPECIFIED = 0;
  RESOURCE_KIND_SERVER = 1;
  RESOURCE_KIND_TOOL = 2;
  RESOURCE_KIND_RESOURCE = 3;
  RESOURCE_KIND_PROMPT = 4;
  RESOURCE_KIND_PEER_AGENT = 5;
}

enum Verdict {
  VERDICT_UNSPECIFIED = 0;
  VERDICT_ALLOW = 1;
  VERDICT_DENY = 2;
  VERDICT_MODIFY = 3;
  VERDICT_ESCALATE = 4;
}

message Actor {
  string agent_id = 1;
  string auth_method = 2;
  google.protobuf.Struct claims = 3;
}

message Resource {
  ResourceKind kind = 1;
  string server = 2;
  // Tool / resource URI / prompt name, when the action targets one.
  string name = 3;
}

message CallRecord {
  string event_id = 1;
  // Action name, matching the Python Action enum values (e.g. "call_tool").
  string action = 2;
  Resource resource = 3;
  string decision = 4;
  google.protobuf.Timestamp at = 5;
}

message SessionContext {
  string session_id = 1;
  repeated string taint_labels = 2;
  repeated CallRecord history = 3;
}

message Event {
  string event_id = 1;
  string correlation_id = 2;
  Direction direction = 3;
  Protocol protocol = 4;
  Actor actor = 5;
  string action = 6;
  Resource resource = 7;
  google.protobuf.Struct payload = 8;
  SessionContext session = 9;
  google.protobuf.Timestamp timestamp = 10;
}

message Decision {
  Verdict verdict = 1;
  string reason = 2;
  string rule_id = 3;
  // Set only when verdict is VERDICT_MODIFY.
  google.protobuf.Struct patched_payload = 4;
  repeated string add_taint = 5;
}
